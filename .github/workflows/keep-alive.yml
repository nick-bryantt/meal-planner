    steps:
      - name: Ping Supabase
        run: |
          curl -s -o /dev/null -w "%{http_code}" \
            "https://mbmsdukfvrokrfxrzggo.supabase.co/rest/v1/recipes?select=id&limit=1" \
            -H "apikey: sb_publishable_wInlRPB2LvSUc2U0uk9jJQ_K2ZAXZbF" \
            -H "Authorization: Bearer sb_publishable_wInlRPB2LvSUc2U0uk9jJQ_K2ZAXZbF"
          echo " - Supabase pinged successfully"
